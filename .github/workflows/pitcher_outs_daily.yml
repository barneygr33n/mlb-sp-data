name: Pitcher Outs Daily

on:
  schedule:
    - cron: '0 10 * * *'   # 5am CDT
    - cron: '0 22 * * *'   # 5pm CDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Build outs board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 daily_outs_tool.py
      - name: Commit and push
        run: |
          git config user.name "outs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/outs_lines_log.csv
          git diff --staged --quiet || git commit -m "Update outs board $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
