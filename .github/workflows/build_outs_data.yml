name: Build Pitcher Outs Data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  outs_data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pull per-start SP lines + team offense P/PA (2021-2026)
        run: python3 build_outs_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "sp-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outs_build_data.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build pitcher outs data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
